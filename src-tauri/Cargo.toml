[package]
name = "daybloom"
version = "0.2.0"
description = "Daybloom — a visual, sectograph-style day planner and timer"
authors = ["Daybloom"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
# Desktop only needs the rlib; a cdylib also trips MinGW's 65k-export limit on Windows.
name = "daybloom_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
# Reads runtime.json (build.rs). The version tauri-build already builds.
serde_json = "1"

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-notification = "2.7"
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-http = "2.8"
tauri-plugin-window-state = "2.5"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Needle weights store (src/assistant.rs): the same reqwest/sha2 tauri-plugin-http already builds.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
sha2 = "0.10"
# Platform backends are target-gated inside keyring, so enabling all is harmless.
# MCP addon token (src/mcp.rs). The version tauri already builds.
getrandom = "0.3"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Web bundles over the air (src/ota.rs): the signature check, key decoding, version order and
# zip reader the updater plugin already builds.
minisign-verify = "0.3"
base64 = "0.22"
semver = "1"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Time Tracker activity sensing (src/activity.rs). The versions tauri already builds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSLocale", "NSFormatter", "NSDateFormatter"] }

[target.'cfg(windows)'.dependencies]
# Clearing a remembered microphone "Block" in WebView2 (src/mic.rs). The version wry already builds.
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
# Keep incremental debug builds quick; dependencies get light optimisation.
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
