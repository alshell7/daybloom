# Tag vX.Y.Z (npm run release) → a draft release in this repo, published only when every build
# and the frontend checks pass; from then on installed copies see it at releases/latest.
# src-tauri/runtime.json says which kind of release it is (scripts/release.mjs sets it):
# - native (runtime.json → native is this version): signed installers for macOS + Windows and
#   the updater's manifest (latest.json), a signed Android APK with android-latest.json, plus
#   this version's web bundle;
# - web update (only the web layer changed): no installers and no APK. The web bundle
#   (web-X.Y.Z-rN.zip, signed with the updater key) goes to installed apps of runtime N — on
#   computers and phones alike — which refresh to it (src-tauri/src/ota.rs); latest.json and
#   android-latest.json are copied from the release before, so both keep offering the last
#   installers.
# web-latest.json lists the newest bundle of each runtime. Copies older than v0.1.8 still read
# the old feed repo, so v0.1.8 is mirrored there once (the `bridge` job).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FEED_REPO: alshell7/daybloom-releases
  FEED_BASE: https://raw.githubusercontent.com/alshell7/daybloom-releases/main

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      runtime: ${{ steps.plan.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - name: Native or web update
        id: plan
        run: |
          node -e '
            const version = require("./package.json").version;
            const rt = require("./src-tauri/runtime.json");
            console.log(["version=" + version, "runtime=" + rt.RUNTIME, "kind=" + (rt.native === version ? "native" : "web")].join("\n"));
          ' | tee -a "$GITHUB_OUTPUT"

  bundle:
    needs: plan
    if: needs.plan.outputs.kind == 'native'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # Restores main's cache (windows.yml saves the Windows one); a tag's own cache could
      # never be read by a later tag, so nothing is saved here.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.platform == 'windows-latest' && 'windows-release' || '' }}
          save-if: false
      - run: npm ci --no-audit --no-fund
      # What this release brings (RELEASE_NOTES.md): the release text, and the notes in
      # latest.json that the app's update card shows.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" || true
            echo
            echo '_Signed builds for macOS (Apple silicon + Intel) and Windows. Installed apps update themselves._'
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: v__VERSION__
          releaseName: Daybloom v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # The web layer as a signed bundle, for every release; a web update's release is made here.
  web:
    needs: [plan, bundle]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.bundle.result == 'success' || needs.bundle.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KIND: ${{ needs.plan.outputs.kind }}
      VERSION: ${{ needs.plan.outputs.version }}
      RUNTIME: ${{ needs.plan.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the web layer
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        run: npm run build
      - name: Pack and sign the bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/web-bundle.mjs pack dist out --version "$VERSION" --runtime "$RUNTIME"
          npx tauri signer sign --app-version "$VERSION" "out/web-$VERSION-r$RUNTIME.zip"
      - name: The web update feed (one bundle per runtime)
        run: |
          ZIP="web-$VERSION-r$RUNTIME.zip"
          gh release download -R "$GITHUB_REPOSITORY" --pattern web-latest.json -D old || echo "No web-latest.json yet: this is the first."
          node scripts/web-bundle.mjs feed old/web-latest.json --version "$VERSION" --runtime "$RUNTIME" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$ZIP" --zip "out/$ZIP" > out/web-latest.json
          cat out/web-latest.json
      - name: Make the release (web update; the updater keeps the last installers)
        if: env.KIND == 'web'
        run: |
          gh release download -R "$GITHUB_REPOSITORY" --pattern latest.json -D out
          gh release download -R "$GITHUB_REPOSITORY" --pattern android-latest.json -D out || echo "No Android release yet."
          {
            node scripts/release-notes.mjs "$VERSION" || true
            echo
            echo '_A web update: installed apps refresh to it, with no install. New downloads get the installers of the release before._'
          } > out/body.md
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --verify-tag --draft --title "Daybloom v$VERSION" --notes-file out/body.md
          gh release upload "v$VERSION" -R "$GITHUB_REPOSITORY" out/latest.json
          if [ -f out/android-latest.json ]; then gh release upload "v$VERSION" -R "$GITHUB_REPOSITORY" out/android-latest.json; fi
      - name: Upload the bundle and the feed
        run: gh release upload "v$VERSION" -R "$GITHUB_REPOSITORY" out/web-*.zip out/web-*.zip.sig out/web-latest.json --clobber

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test

  # The Android app, for a native release: a signed universal APK (64- and 32-bit ARM) and
  # android-latest.json, which installed phones read to offer the update
  # (src/lib/native/apkUpdate.ts). Needs the upload key in the repo's secrets (ANDROID_KEYSTORE
  # base64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS); without them it says so and steps
  # aside, so a release never waits on it.
  android:
    needs: [plan, bundle]
    if: needs.plan.outputs.kind == 'native'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - name: No signing key yet
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Android skipped — add ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS to the repo's secrets."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        if: env.HAS_KEY == 'true'
      - name: SDK platform, build tools and NDK
        if: env.HAS_KEY == 'true'
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;27.1.12297006" >/dev/null
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_KEY == 'true'
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        if: env.HAS_KEY == 'true'
        with:
          workspaces: src-tauri -> target
          save-if: false
      - run: npm ci --no-audit --no-fund
        if: env.HAS_KEY == 'true'
      - name: The upload key (never written to the repo)
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\npassword=%s\nkeyAlias=%s\n' "$RUNNER_TEMP/upload.jks" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" > src-tauri/gen/android/keystore.properties
      - name: Build the APK
        if: env.HAS_KEY == 'true'
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        run: npx tauri android build --apk --target aarch64 --target armv7
      - name: Upload the APK and android-latest.json
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="Daybloom_${VERSION}_android.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          NOTES=$(node scripts/release-notes.mjs "$VERSION" 2>/dev/null || true)
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$APK"
          node -e 'const [v,u,s,n]=process.argv.slice(1); process.stdout.write(JSON.stringify({version:v,url:u,sha256:s,notes:n},null,2)+"\n")' "$VERSION" "$URL" "$SHA" "$NOTES" > android-latest.json
          cat android-latest.json
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "$APK" android-latest.json --clobber

  publish:
    needs: [plan, web, check, android]
    # A web update skips the Android job; anything else must have passed.
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.check.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plain-text notes in the update feed (apps before 0.1.12 show them as-is)
        if: needs.plan.outputs.kind == 'native'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --pattern latest.json -D feed
          node scripts/release-notes.mjs --plain-json feed/latest.json
          head -c 400 feed/latest.json
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" feed/latest.json --clobber
      - name: Publish the release (installed copies update from it from now on)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest

  # Copies before v0.1.8 read alshell7/daybloom-releases. Mirror v0.1.8 there once so they
  # update; v0.1.8 itself reads this repo's releases. Later tags skip this.
  bridge:
    if: github.ref_name == 'v0.1.8'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D out
          ls -la out
      - name: Point the update manifest at the public feed
        run: node .github/scripts/public-feed.mjs out "$FEED_BASE" "$VERSION"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RELEASES_DEPLOY_KEY }}
      - name: Publish to the feed repo (latest release only, history kept small)
        run: |
          git clone --depth 1 "git@github.com:$FEED_REPO.git" feed
          cd feed
          git checkout --orphan next
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp ../out/* .
          git add -A
          git -c user.name="daybloom-release" -c user.email="releases@users.noreply.github.com" commit -qm "Daybloom v$VERSION"
          git push -f origin next:main
