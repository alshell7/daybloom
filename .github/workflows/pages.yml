# Builds the website in site/ and publishes it to GitHub Pages (https://alshell7.github.io/daybloom/).
# It runs when the site, the release notes or this file change on main, after each successful
# release (so the download buttons and the changelog follow the new version), and by hand.
# Before the first run: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one that is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      # Reads the latest release from the GitHub API (for the download links), then builds and
      # prerenders the page into site/dist.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
