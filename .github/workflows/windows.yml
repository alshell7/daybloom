# Windows: install Daybloom on a clean runner and check the transparent widget, its layers,
# the tray, notifications, the theme reveal and idle CPU (scripts/windows-smoke.mjs).
# Pushes to main and pull requests that touch the app build an unsigned installer from source;
# the test then runs in two halves side by side (functional, idle). A finished release run (or
# a manual run with `release`) tests that release's own installers instead, and a manual run
# with `baseline` also tests the latest release next to the build. A newer push cancels the
# older run. Screenshots and numbers land in the run summary and the smoke artifacts.
name: windows

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.ts'
      - 'svelte.config.js'
      - 'scripts/windows-smoke.mjs'
      - 'scripts/win32.ps1'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.ts'
      - 'svelte.config.js'
      - 'scripts/windows-smoke.mjs'
      - 'scripts/win32.ps1'
      - '.github/workflows/windows.yml'
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to test (e.g. v0.1.0). Leave empty to build this branch.
        required: false
        default: ''
      baseline:
        description: Also test the latest release next to the build, as a baseline.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' }}

jobs:
  build:
    # The release commit only bumps versions; its release run is tested once it is published.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Release v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release == '')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Shared with the release workflow's Windows build, which restores main's copy.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci --no-audit --no-fund
      # Test build only: unsigned (updater artifacts need the release signing key, which pull
      # requests never get) and with a DevTools port in both windows' WebView2 args, so the
      # smoke test can read page state. WebView2 ignores the env-var/registry overrides for it.
      - name: Tauri config for the test build
        shell: bash
        run: |
          node -e "
            const c = require('./src-tauri/tauri.conf.json');
            const windows = c.app.windows.map((w) => ({ ...w, additionalBrowserArgs: (w.additionalBrowserArgs ?? '') + ' --remote-debugging-port=9222' }));
            require('fs').writeFileSync('smoke.conf.json', JSON.stringify({ bundle: { createUpdaterArtifacts: false }, app: { windows } }));
          "
      - run: npx tauri build --config smoke.conf.json
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: daybloom-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7

  smoke:
    needs: build
    if: >-
      always() && (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && github.event_name != 'pull_request' && github.event_name != 'push' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled')))
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.build.result == 'success' && (inputs.baseline && '["build","release"]' || '["build"]') || '["release"]') }}
        part: [functional, idle]
    name: smoke (${{ matrix.source }}, ${{ matrix.part }})
    runs-on: windows-latest
    timeout-minutes: 30
    # Next to a build, the release leg is only the baseline to compare against.
    continue-on-error: ${{ matrix.source == 'release' && needs.build.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: matrix.source == 'build'
        uses: actions/download-artifact@v4
        with:
          name: daybloom-windows
          path: artifact
      - if: matrix.source == 'release'
        name: Download the release installers
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.event.workflow_run.head_branch }}
        run: |
          case "$TAG" in v*) ;; *) TAG=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName) ;; esac
          # A web update (release.yml) has no installers of its own.
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -q -- '-setup\.exe$'; then
            echo "::notice::$TAG is a web update: no installers to test."
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Testing release $TAG"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*-setup.exe' -p '*.msi' -D artifact
      - if: steps.release.outputs.web != 'true'
        run: node scripts/windows-smoke.mjs smoke-out artifact
        env:
          SMOKE_SOURCE: ${{ matrix.source }}
          SMOKE_PART: ${{ matrix.part }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-${{ matrix.source }}-${{ matrix.part }}
          path: smoke-out
