    <!--
      THESIS: Time is a shape you can hold. A Bauhaus watch dial whose bezel inserts are your
      day's blocks; you plan by sweeping the bezel, not by filling forms. Refuses the
      category default of a calendar grid with a clock pasted beside it.
      OWN-WORLD: Max-Bill-thin dial lettering (Lexend 300), a minute track drawn as one hairline
      path, seven bezel-insert colours (focus blue, care green, routine amber, people pink,
      rest lilac, learn teal, move orange) on a cool fog desk; signal-orange now-hand; finished
      blocks carry a lume rim that glows on dark dials. Dial finishes: Glacier, Ink, Salmon,
      Mint, Slate, Tropic.
      STORY: At a glance you see what is now, how much of it is left (as angle), and what is
      next. You sweep to plan, tick to finish, and finished time glows.
      FIRST VIEWPORT: the dial dominates the left two-thirds at up to 660px with the countdown
      in its face; the day rail (Structured-style timeline) runs down the right; the week strip
      sits above the dial and the reference switcher (12 h / 24 h / Hour / Cycles) sits under it
      like a crown under a case, so the dial stays first in reading order. Toasts rise from
      the foot of the rail, never over the dial or its controls.
      FORM: own-world "watch dial & bezel", grounded list position 5, seed 150afe9c.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
